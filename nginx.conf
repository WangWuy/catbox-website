server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Static assets with hash (Astro bundle assets)
    location ~* ^/_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media, fonts, icons & images
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML files, RSS/Sitemap & search index: ensure freshness
    location ~* \.(?:html|xml|json)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Pagefind search files
    location ^~ /pagefind/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Astro Routing: support clean URLs and directory index
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 404 Error handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

