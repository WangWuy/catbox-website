name: Build and Deploy (Self-Hosted VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build lại toàn bộ các site (bỏ qua kiểm tra git diff)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Detect, Build & Deploy on VPS
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Detect changed services
        id: changes
        run: |
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          FORCE_ALL="${{ github.event.inputs.force_all }}"

          LAST_SHA=""
          if [ -f "/opt/catbox/.last_deployed_sha" ]; then
            LAST_SHA=$(cat /opt/catbox/.last_deployed_sha | tr -d '[:space:]')
          fi

          SHARED="false"
          CFC="false"
          CFC_ADMIN="false"
          CATBOX="false"
          TETTA="false"

          if [ "$IS_DISPATCH" = "true" ] || [ "$FORCE_ALL" = "true" ]; then
            echo "🔄 Manual trigger — rebuilding all services."
            SHARED="true"
          elif [ -n "$LAST_SHA" ] && git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
            echo "🔍 Comparing current HEAD ($(git rev-parse --short HEAD)) against last deployed SHA (${LAST_SHA:0:7})..."
            CHANGED_FILES=$(git diff --name-only "$LAST_SHA" HEAD)
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "🔍 Comparing HEAD~1..HEAD..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            echo "🔄 Initial commit — rebuilding all services."
            SHARED="true"
          fi

          if [ "$SHARED" != "true" ]; then
            echo "📝 Changed files:"
            echo "${CHANGED_FILES:-<none>}"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                packages/*|scripts/check-content.mjs|scripts/gen-placeholder.mjs|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|Dockerfile|docker-compose.yml|nginx.conf)
                  SHARED="true"
                  ;;
                sites/cfc/keystatic.config.ts|sites/cfc/astro.config.mjs|sites/cfc/package.json)
                  CFC="true"
                  CFC_ADMIN="true"
                  ;;
                sites/cfc/*)
                  CFC="true"
                  ;;
                sites/catbox/*)
                  CATBOX="true"
                  ;;
                sites/tetta/*)
                  TETTA="true"
                  ;;
              esac
            done <<< "${CHANGED_FILES:-}"
          fi

          if [ "$SHARED" = "true" ]; then
            CFC="true"
            CFC_ADMIN="true"
            CATBOX="true"
            TETTA="true"
          fi

          SERVICES=""
          if [ "$CFC" = "true" ]; then
            SERVICES="$SERVICES cfc"
          fi
          if [ "$CFC_ADMIN" = "true" ]; then
            SERVICES="$SERVICES cfc-admin"
          fi
          if [ "$CATBOX" = "true" ]; then
            SERVICES="$SERVICES catbox"
          fi
          if [ "$TETTA" = "true" ]; then
            SERVICES="$SERVICES tetta"
          fi

          # Trim leading whitespace
          SERVICES=$(echo "$SERVICES" | xargs)

          if [ -z "$SERVICES" ]; then
            echo "⏭️ Không có thay đổi nào ảnh hưởng tới các site. Bỏ qua build."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
          else
            echo "🎯 Services cần build & deploy: $SERVICES"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync & Deploy on Local VPS Docker
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          set -euo pipefail

          # 1. Xác định thư mục dự án trên VPS
          if [ -d "/opt/catbox" ]; then
            DEPLOY_DIR="/opt/catbox"
          elif [ -d "/var/www/catbox" ]; then
            DEPLOY_DIR="/var/www/catbox"
          else
            DEPLOY_DIR="/opt/catbox"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$(whoami):$(id -gn)" "$DEPLOY_DIR"
          fi

          echo "🚀 Working in $DEPLOY_DIR..."

          # 2. Đồng bộ mã nguồn mới nhất từ workspace của runner sang DEPLOY_DIR (giữ nguyên .env)
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.last_deployed_sha' \
            --exclude='.git' \
            --exclude='node_modules' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

          cd "$DEPLOY_DIR"

          # 3. Chuẩn hoá đường dẫn ảnh CFC trước khi build (tránh lệch slug từ Keystatic)
          if [[ " $SERVICES " == *" cfc "* ]] && [ -f "sites/cfc/scripts/normalize-images.mjs" ]; then
            if command -v node >/dev/null 2>&1; then
              echo "🖼️ Normalizing CFC image paths before build..."
              node sites/cfc/scripts/normalize-images.mjs || true
            fi
          fi

          # 4. Đảm bảo file .env tồn tại
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "⚠️ .env not found, creating from .env.example..."
            cp .env.example .env
          fi

          # 5. Build tuần tự từng service thay đổi để tận dụng Docker layer cache & tiết kiệm RAM VPS
          for svc in $SERVICES; do
            echo "🔨 Building Docker image for service: $svc ..."
            docker compose --profile admin build "$svc"
          done

          # 6. Khởi động lại đúng các container vừa được cập nhật
          echo "🐳 Updating running containers: $SERVICES ..."
          docker compose --profile admin up -d --no-build $SERVICES

          # 7. Lưu lại commit SHA đã deploy thành công để lần chạy sau so sánh chính xác
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > /opt/catbox/.last_deployed_sha

          # 8. Dọn dẹp các image tạm (dangling) để giải phóng ổ cứng NVMe
          echo "🧹 Pruning dangling Docker images..."
          docker image prune -f

          echo "✅ Self-hosted deployment completed successfully!"
