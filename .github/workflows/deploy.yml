name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site: cfc
            target: runner-static
            image_name: site-cfc
            extra_args: ""
          - site: catbox
            target: runner-static
            image_name: site-catbox
            extra_args: ""
          - site: tetta
            target: runner-static
            image_name: site-tetta
            extra_args: ""
          - site: cfc
            target: runner-ssr
            image_name: cfc-admin
            extra_args: KEYSTATIC_ADMIN=node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO_LOWER}/${{ matrix.image_name }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            SITE=${{ matrix.site }}
            ${{ matrix.extra_args }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # 1. Chuyển vào thư mục dự án trên VPS
            if [ -d "/opt/catbox" ]; then
              cd /opt/catbox
            elif [ -d "/var/www/catbox" ]; then
              cd /var/www/catbox
            else
              cd "${{ secrets.VPS_PROJECT_DIR }}"
            fi
            echo "🚀 Working in $(pwd)..."

            # 2. Đảm bảo quyền Git trong thư mục
            git config --global --add safe.directory '*'

            # 3. Cấu hình origin với token xác thực từ GitHub Actions để sync file cấu hình
            AUTH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            CLEAN_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d .git ]; then
              echo "🔧 Initializing git repository..."
              git init -b main
            fi
            git remote remove origin 2>/dev/null || true
            git remote add origin "$AUTH_URL"

            # 4. Kéo cấu hình mới nhất từ branch main (docker-compose.yml, nginx.conf...)
            echo "📥 Fetching and syncing latest config from main..."
            git fetch origin main
            git reset --hard origin/main

            # 5. Xoá token khỏi Git config để bảo mật
            git remote set-url origin "$CLEAN_URL"

            # 6. Đảm bảo file .env tồn tại
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                echo "⚠️ .env not found, creating from .env.example..."
                cp .env.example .env
              fi
            fi

            # 7. Đăng nhập GHCR bằng GITHUB_TOKEN tạm thời để pull prebuilt images
            echo "🔐 Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 8. Kéo các image đã build sẵn từ GHCR về VPS
            echo "📥 Pulling latest prebuilt images from GHCR..."
            docker compose --profile admin pull

            # 9. Khởi động lại container (không tốn CPU biên dịch trên VPS)
            echo "🐳 Starting Docker containers..."
            docker compose --profile admin up -d

            # 10. Đăng xuất GHCR để bảo mật
            docker logout ghcr.io

            # 11. Dọn dẹp Docker images cũ
            echo "🧹 Pruning dangling docker images..."
            docker image prune -f

            echo "✅ Deployment finished successfully in seconds!"
