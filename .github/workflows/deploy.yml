name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Containers to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # 1. Chuyển vào thư mục dự án trên VPS
            if [ -d "/opt/catbox" ]; then
              cd /opt/catbox
            elif [ -d "/var/www/catbox" ]; then
              cd /var/www/catbox
            else
              cd "${{ secrets.VPS_PROJECT_DIR }}"
            fi
            echo "🚀 Working in $(pwd)..."

            # 2. Đảm bảo quyền Git trong thư mục
            git config --global --add safe.directory '*'

            # 3. Cấu hình origin với token xác thực từ GitHub Actions
            AUTH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            CLEAN_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d .git ]; then
              echo "🔧 Initializing git repository..."
              git init -b main
            fi
            git remote remove origin 2>/dev/null || true
            git remote add origin "$AUTH_URL"

            # 4. Kéo code mới nhất từ branch main
            echo "📥 Fetching and syncing latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # 5. Xoá token khỏi Git config để bảo mật
            git remote set-url origin "$CLEAN_URL"

            # 6. Đảm bảo file .env tồn tại
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                echo "⚠️ .env not found, creating from .env.example..."
                cp .env.example .env
              fi
            fi

            # 7. Build và khởi động lại container (bao gồm profile admin cho Keystatic SSR)
            echo "🐳 Building and starting Docker containers..."
            docker compose --profile admin up -d --build

            # 8. Dọn dẹp Docker images cũ
            echo "🧹 Pruning dangling docker images..."
            docker image prune -f

            echo "✅ Deployment finished successfully!"
